name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Basic tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [secret-scan, test]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean MMToolkit.spec

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: test -d "dist/MM Toolkit.app"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MM Toolkit/MM Toolkit.exe")) {
            throw "Windows executable was not built"
          }

      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: develop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/MM Toolkit.app
            dist/MM Toolkit
          if-no-files-found: error
          retention-days: 7
