name: Main Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build release (${{ matrix.os }})
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean MediaToolsForRecordLabels.spec

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/build.keychain"
          codesign --deep --force --options runtime --timestamp --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "dist/Media Tools for Record Labels.app"

      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Media Tools for Record Labels.app" media-tools-for-record-labels-macos.zip

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Media Tools for Record Labels" -srcfolder "dist/Media Tools for Record Labels.app" -ov -format UDZO media-tools-for-record-labels-macos.dmg

      - name: Notarize macOS packages
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit media-tools-for-record-labels-macos.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple media-tools-for-record-labels-macos.dmg

      - name: Import and sign Windows application
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "Windows signtool.exe was not found." }
          & $signTool.FullName sign /f "$env:RUNNER_TEMP\certificate.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\Media Tools for Record Labels\Media Tools for Record Labels.exe"

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Media Tools for Record Labels" -DestinationPath media-tools-for-record-labels-windows.zip

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows-installer.iss
          Copy-Item release\media-tools-for-record-labels-windows-setup.exe .

      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "Windows signtool.exe was not found." }
          & $signTool.FullName sign /f "$env:RUNNER_TEMP\certificate.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 media-tools-for-record-labels-windows-setup.exe

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            media-tools-for-record-labels-*.zip
            media-tools-for-record-labels-*.dmg
            media-tools-for-record-labels-*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [secret-scan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: release-${{ github.run_number }}
        run: |
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Media Tools for Record Labels $TAG" \
            --generate-notes
