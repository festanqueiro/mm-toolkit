name: Develop CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean MediaToolsForRecordLabels.spec

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: test -d "dist/Media Tools for Record Labels.app"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Media Tools for Record Labels/Media Tools for Record Labels.exe")) {
            throw "Windows executable was not built"
          }

      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: develop-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/Media Tools for Record Labels.app
            dist/Media Tools for Record Labels
          if-no-files-found: error
          retention-days: 7
